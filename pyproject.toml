[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-robot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==1.27.0",
    "paramiko==4.0.0",
    "google-genai==1.73.1",
    "ollama==0.6.2",
    "Pillow==12.2.0",
    "opencv-python==4.13.0.92",
    "numpy==2.4.4",
    "simple-lama-inpainting==0.1.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ultralytics==8.4.53",
    "transformers==4.57.6",
]

[project.optional-dependencies]
viz = [
    "rerun-sdk==0.31.3",
]

[project.scripts]
mcp-robot = "mcp_robot.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls external APIs (Gemini, camera) — run with -m live",
]
